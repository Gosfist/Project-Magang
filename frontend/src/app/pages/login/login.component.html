<main
  class="login-layout"
>
  <aside class="login-brand" aria-label="PT UNZANET">
    <a routerLink="/" class="login-brand-logo"><img src="logo.png" alt="PT UNZANET" width="110" height="54" /></a>
    <div><p class="login-eyebrow">RUANG KERJA UNZANET</p><h2>Operasional tertata.<br />Layanan terjaga.</h2><p class="login-brand-copy">Kelola pelanggan, jaringan, dan keuangan dalam satu ruang kerja.</p></div>
    <p class="login-brand-footer">PT UNZANET &middot; Internet fiber optik</p>
  </aside>
  <div class="login-form-panel">
  <div class="login-form">
    <a routerLink="/" class="login-mobile-logo mb-7 flex">
      <img src="logo.png" alt="PT UNZANET" width="130" height="64" />
    </a>
    <h1 class="text-3xl font-semibold tracking-tight">Masuk Dashboard</h1>
    <p class="mt-3 text-sm text-slate-500">
      Gunakan akun Anda untuk masuk.
    </p>
    @if (error()) {
      <p
        role="alert"
        class="mt-5 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"
      >
        {{ error() }}
      </p>
    }
    <form (ngSubmit)="submit()" class="mt-8 space-y-5">
      <div>
        <label for="login-email" class="label">Email</label>
        <input
          class="input"
          id="login-email"
          autocomplete="username"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          autofocus
        />
      </div>
      <div>
        <label for="login-password" class="label">Kata Sandi</label>
        <div class="relative">
          <input
            id="login-password"
            autocomplete="current-password"
            class="input pr-12"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-slate-500 hover:text-slate-900"
            [attr.aria-label]="showPassword ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'"
            [title]="showPassword ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'"
            (click)="showPassword = !showPassword"
          >
            @if (showPassword) {
              <svg lucideEyeOff [size]="20"></svg>
            } @else {
              <svg lucideEye [size]="20"></svg>
            }
          </button>
        </div>
      </div>
      <button class="btn-primary w-full" [disabled]="busy()">
        {{ busy() ? "Memproses..." : "Masuk" }}
      </button>
    </form>
    <a
      routerLink="/"
      class="mt-5 block text-center text-sm text-slate-500 hover:text-blue-700"
      >← Kembali ke profil perusahaan</a
    >
  </div>
  </div>
</main>
