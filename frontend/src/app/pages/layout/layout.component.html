@if (auth.loading() || !auth.user()) {
  <div class="flex min-h-screen items-center justify-center text-slate-500">
    Memuat dashboard...
  </div>
} @else {
  <div class="dashboard-shell min-h-screen">
    <app-sidebar [(mobile)]="mobile" />
    <div class="min-w-0 lg:ml-64">
      <app-header (openSidebar)="mobile.set(true)" />
      <!-- konten -->
      <main class="p-4 sm:p-6 lg:p-7">
        <router-outlet />
      </main>
    </div>
  </div>
}
