<header class="flex min-h-20 items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-3 sm:px-6 lg:px-8">
  <div class="flex min-w-0 items-center gap-1 sm:gap-3">
    <button aria-label="Buka sidebar" class="shrink-0 rounded-lg p-2 hover:bg-slate-100 lg:hidden" (click)="openSidebar.emit()">
      <svg lucideMenu [size]="24"></svg>
    </button>
    <h1 class="min-w-0 break-words text-base font-semibold tracking-tight sm:text-lg">{{ title() }}</h1>
  </div>
  <!-- Tanggal dan jam saat ini dalam zona waktu WIB. -->
  <div class="flex shrink-0 items-center gap-1.5 rounded-md px-2 py-1.5 text-xs leading-4 text-slate-600 sm:gap-2 sm:px-3 sm:py-2 sm:text-sm">
    <svg lucideClock3 [size]="15" class="hidden shrink-0 text-slate-400 sm:block"></svg>
    <span class="text-right sm:hidden">
      <span class="block whitespace-nowrap">{{ compactDate() }}</span>
      <span class="block whitespace-nowrap tabular-nums">{{ time() }} WIB</span>
    </span>
    <span class="hidden whitespace-nowrap sm:inline">{{ dateTime() }}</span>
  </div>
</header>
