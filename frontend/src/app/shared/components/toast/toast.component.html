<div [class]="'fixed bottom-4 right-4 z-[100] flex max-w-sm items-start gap-3 rounded-lg border p-4 shadow-lg ' +
  (type === 'success' ? 'border-green-200 bg-green-50 text-green-800' : 'border-red-200 bg-red-50 text-red-800')">
  <span class="text-sm">{{ message }}</span>
  <button (click)="close.emit()" aria-label="Tutup">
    <svg lucideX [size]="16"></svg>
  </button>
</div>
